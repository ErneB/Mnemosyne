
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========================================
         1. PAGE SETTINGS
    ======================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta name="theme-color" content="#f8fafc">

    <title>Mnemosyne | Greek Vocabulary</title>

    <!-- Shared stylesheet -->
    
<link rel="stylesheet" href="styles.css?v=5">

<script src="vocabulary.js?v=3" defer></script>

</head>

<body>

    <main class="app vocabularyMode">

        <!-- ====================================
             2. HEADER
        ==================================== -->

        <header class="appHeader">
        
<!-- Compact study mode navigation -->

<nav class="modeNavigation" aria-label="Study mode">

    <select
        aria-label="Choose study mode"
        onchange="window.location.href = this.value"
    >
        <option value="index.html" selected>
            Vocabulary
        </option>

        <option value="passage.html">
            Passages
        </option>
    </select>

</nav>

            <p class="eyebrow">Ancient Greek Study</p>

            <h1>Mnemosyne</h1>

            <p class="subtitle">
                Build your vocabulary, one word at a time.
            </p>
        </header>

        <!-- ====================================
             3. STUDY SETTINGS
        ==================================== -->

        <section
            class="settingsPanel"
            aria-label="Study settings"
        >

            <h2 class="panelTitle">Study Settings</h2>

            <div class="studyFilters">

                <div class="filterGroup">
                    <label for="chapterSelect">
                        Chapter
                    </label>

                    <select
                        id="chapterSelect"
                        onchange="selectChapter()"
                    >
                        <option value="all">
                            All Chapters
                        </option>
                    </select>
                </div>

                <div class="filterGroup">
                    <label for="sectionSelect">
                        Section
                    </label>

                    <select
                        id="sectionSelect"
                        onchange="selectSection()"
                    >
                        <option value="all">
                            All Sections
                        </option>
                    </select>
                </div>

            </div>

            <!-- Language and shuffle options -->

            <div class="studyOptions">

                <div class="languageControl">

                    <label
                        for="languageToggle"
                        id="languageLabel"
                    >
                        Greek First
                    </label>

                    <label class="switch">

                        <input
                            type="checkbox"
                            id="languageToggle"
                            aria-label="Start with English"
                            onchange="toggleLanguage()"
                        >

                        <span class="switchSlider"></span>

                    </label>

                </div>

                <button
                    type="button"
                    id="shuffleButton"
                    onclick="shuffleCards()"
                >
                    ⇄ Shuffle
                </button>

            </div>

        </section>

        <!-- ====================================
             4. FLASHCARD
        ==================================== -->

        <section
            class="flashcardArea"
            aria-label="Flashcards"
        >

            <div class="flashcardHeader">
                <span>FLASHCARD</span>
                <span id="cardSideLabel">GREEK</span>
            </div>

           
<div id="flashcardBox">

    <!-- LEFT: Previous vocabulary word -->
    <div
        class="cardEdge leftEdge"
        onclick="previousCard()"
    >
        &#10094;
    </div>

    <!-- CENTER: Reveal translation -->
    <div
        id="flashcardText"
        onclick="flipCard()"
    >
        Loading...
    </div>

    <!-- RIGHT: Next vocabulary word -->
    <div
        class="cardEdge rightEdge"
        onclick="nextCard()"
    >
        &#10095;
    </div>

</div>


            <!-- Card progress -->

            <div class="progressArea">

                <p id="cardCounter">
                    Card 0 of 0
                </p>

                <div
                    class="progressTrack"
                    id="progressTrack"
                    role="progressbar"
                    aria-label="Deck progress"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                >
                    <div id="progressFill"></div>
                </div>

            </div>

        </section>

        <!-- ====================================
             5. CARD CONTROLS
        ==================================== -->

        <section
            class="cardControls"
            aria-label="Card controls"
        >

            <button
                type="button"
                class="actionButton"
                id="revealButton"
                onclick="flipCard()"
            >
                Reveal Answer
            </button>

            <div class="navigationButtons">

                <button
                    type="button"
                    class="actionButton"
                    id="previousButton"
                    onclick="previousCard()"
                >
                    ← Previous
                </button>

                <button
                    type="button"
                    class="actionButton"
                    id="nextButton"
                    onclick="nextCard()"
                >
                    Next →
                </button>

            </div>

        </section>

        <!-- ====================================
             6. FOOTER
        ==================================== -->

        <footer class="appFooter">
            MNEMOSYNE · GREEK VOCABULARY
        </footer>

    </main>

</body>
</html>
