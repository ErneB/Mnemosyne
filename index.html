
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========================================
         PAGE SETTINGS
    ========================================= -->

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Mnemosyne</title>

    <style>
        /* ========================================
           1. GLOBAL STYLES
        ======================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #111827;
        }

        h1 {
            margin: 20px 0 5px;
            font-size: 36px;
        }

        h2 {
            margin: 0 0 25px;
            font-size: 22px;
            color: #475569;
        }


        /* ========================================
           2. VOCABULARY FILTERS
        ======================================== */

        .studyFilters {
            display: grid;
            grid-template-columns:
                minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            width: 100%;
            margin: 24px 0;
        }

        .filterGroup {
            min-width: 0;
        }

        .filterGroup label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #374151;
        }

        .filterGroup select {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 14px 8px;
            font-size: 16px;
            color: #1e40af;
            background-color: #eff6ff;
            border: 2px solid #93c5fd;
            border-radius: 12px;
        }


        /* ========================================
           3. FLASHCARD DISPLAY
        ======================================== */

        #flashcardBox {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;
            min-height: 250px;
            padding: 20px;
            margin: 30px 0 15px;

            background-color: white;
            border: 2px solid #d1d5db;
            border-radius: 16px;
        }

        #flashcard {
            width: 100%;
            margin: 0;

            font-size: 72px;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;

            white-space: nowrap;
            overflow-wrap: normal;
            word-break: normal;
        }


        /* ========================================
           4. CARD COUNTER
        ======================================== */

        #cardCounter {
            margin: 10px 0 25px;
            font-size: 16px;
            text-align: center;
            color: #64748b;
        }


        /* ========================================
           5. FLASHCARD BUTTONS
        ======================================== */

        button {
            display: block;
            width: 100%;
            padding: 18px 24px;
            margin: 12px 0;

            font-size: 20px;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #revealButton {
            background-color: #2563eb;
        }

        #nextButton {
            background-color: #16a34a;
        }

        #previousButton {
            background-color: #dc2626;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

    </style>
</head>


<body>

    <!-- ========================================
         1. PAGE HEADER
    ========================================= -->

    <h1>Mnemosyne</h1>
    <h2>Greek Vocabulary</h2>


    <!-- ========================================
         2. VOCABULARY FILTERS
    ========================================= -->

    <div class="studyFilters">

        <div class="filterGroup">
            <label for="chapterSelect">
                Chapter
            </label>

            <select
                id="chapterSelect"
                onchange="selectChapter()"
            >
                <option value="all">
                    All Chapters
                </option>
            </select>
        </div>

        <div class="filterGroup">
            <label for="sectionSelect">
                Section
            </label>

            <select
                id="sectionSelect"
                onchange="selectSection()"
            >
                <option value="all">
                    All Sections
                </option>
            </select>
        </div>

    </div>


    <!-- ========================================
         3. FLASHCARD
    ========================================= -->

    <div id="flashcardBox">
        <p id="flashcard">
            Loading vocabulary...
        </p>
    </div>


    <!-- ========================================
         4. CARD COUNTER
    ========================================= -->

    <p id="cardCounter">
        Card 0 of 0
    </p>


    <!-- ========================================
         5. FLASHCARD CONTROLS
    ========================================= -->

    <button
        id="revealButton"
        onclick="flipCard()"
    >
        Reveal Answer
    </button>

    <button
        id="nextButton"
        onclick="nextCard()"
    >
        Next Card
    </button>

    <button
        id="previousButton"
        onclick="previousCard()"
    >
        Previous Card
    </button>


    <script>
        /* ========================================
           1. APPLICATION STATE
        ======================================== */

        // Complete vocabulary database
        let cards = [];

        // Cards matching the selected filters
        let studyCards = [];

        // Current position in the study deck
        let currentIndex = 0;

        // Whether the English answer is visible
        let showingAnswer = false;


        /* ========================================
           2. LOAD VOCABULARY
        ======================================== */

        async function loadCards() {
            try {
                const response = await fetch("words.json");

                if (!response.ok) {
                    throw new Error(
                        "Could not load words.json"
                    );
                }

                const data = await response.json();

                if (!Array.isArray(data)) {
                    throw new Error(
                        "Vocabulary must be a JSON array"
                    );
                }

                cards = data;

                populateChapters();
                selectChapter();

            } catch (error) {
                console.error(error);

                document.getElementById(
                    "flashcard"
                ).textContent = "Error loading vocabulary";

                document.getElementById(
                    "cardCounter"
                ).textContent = "Check words.json";
            }
        }


        /* ========================================
           3. POPULATE CHAPTERS
        ======================================== */

        function populateChapters() {
            const select = document.getElementById(
                "chapterSelect"
            );

            select.innerHTML =
                '<option value="all">All Chapters</option>';

            const chapters = [
                ...new Set(
                    cards
                        .filter(card =>
                            card.chapter !== undefined &&
                            card.chapter !== null
                        )
                        .map(card => String(card.chapter))
                )
            ].sort((a, b) => {
                if (a === "general") return 1;
                if (b === "general") return -1;

                return Number(a) - Number(b);
            });

            for (const chapter of chapters) {
                const option = document.createElement(
                    "option"
                );

                option.value = chapter;

                option.textContent =
                    chapter === "general"
                        ? "General Vocabulary"
                        : "Chapter " + chapter;

                select.appendChild(option);
            }
        }


        /* ========================================
           4. POPULATE SECTIONS
        ======================================== */

        function populateSections() {
            const chapter = document.getElementById(
                "chapterSelect"
            ).value;

            const sectionSelect = document.getElementById(
                "sectionSelect"
            );

            sectionSelect.innerHTML =
                '<option value="all">All Sections</option>';

            const chapterCards = cards.filter(card =>
                chapter === "all" ||
                String(card.chapter) === chapter
            );

            const sections = [
                ...new Set(
                    chapterCards
                        .filter(card =>
                            card.section !== undefined &&
                            card.section !== null
                        )
                        .map(card => String(card.section))
                )
            ].sort();

            for (const section of sections) {
                const option = document.createElement(
                    "option"
                );

                option.value = section;
                option.textContent =
                    "Section " + section;

                sectionSelect.appendChild(option);
            }
        }


        /* ========================================
           5. FILTER VOCABULARY
        ======================================== */

        function selectChapter() {
            populateSections();
            selectSection();
        }

        function selectSection() {
            const chapter = document.getElementById(
                "chapterSelect"
            ).value;

            const section = document.getElementById(
                "sectionSelect"
            ).value;

            studyCards = cards.filter(card => {
                const chapterMatches =
                    chapter === "all" ||
                    String(card.chapter) === chapter;

                const sectionMatches =
                    section === "all" ||
                    String(card.section) === section;

                return chapterMatches && sectionMatches;
            });

            currentIndex = 0;
            showingAnswer = false;

            displayCard();
        }


        /* ========================================
           6. DISPLAY FLASHCARD
        ======================================== */

        function displayCard() {
            const flashcard = document.getElementById(
                "flashcard"
            );

            const counter = document.getElementById(
                "cardCounter"
            );

            if (studyCards.length === 0) {
                flashcard.textContent =
                    "No vocabulary available";

                counter.textContent = "Card 0 of 0";
                return;
            }

            const currentCard = studyCards[currentIndex];

            flashcard.textContent = showingAnswer
                ? currentCard.english
                : currentCard.greek;

            counter.textContent =
                `Card ${currentIndex + 1} of ${studyCards.length}`;

            fitFlashcardText();
        }


        /* ========================================
           7. AUTOMATIC TEXT RESIZING
        ======================================== */

        function fitFlashcardText() {
            const flashcard = document.getElementById(
                "flashcard"
            );

            const availableWidth = flashcard.clientWidth;

            let fontSize = 72;

            flashcard.style.fontSize = `${fontSize}px`;

            while (
                flashcard.scrollWidth > availableWidth &&
                fontSize > 12
            ) {
                fontSize -= 2;
                flashcard.style.fontSize = `${fontSize}px`;
            }
        }


        /* ========================================
           8. FLASHCARD NAVIGATION
        ======================================== */

        function flipCard() {
            if (studyCards.length === 0) return;

            showingAnswer = !showingAnswer;

            displayCard();
        }

        function nextCard() {
            if (studyCards.length === 0) return;

            currentIndex =
                (currentIndex + 1) % studyCards.length;

            showingAnswer = false;

            displayCard();
        }

        function previousCard() {
            if (studyCards.length === 0) return;

            currentIndex =
                (currentIndex - 1 + studyCards.length) %
                studyCards.length;

            showingAnswer = false;

            displayCard();
        }


        /* ========================================
           9. WINDOW RESIZING
        ======================================== */

        window.addEventListener(
            "resize",
            fitFlashcardText
        );


        /* ========================================
           10. START APPLICATION
        ======================================== */

        loadCards();

    </script>

</body>
</html>
