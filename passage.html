
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========================================
         1. PAGE SETTINGS
    ======================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta name="theme-color" content="#f8fafc">

    <title>Mnemosyne | Passage Mode</title>

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Passage JavaScript -->
    <script src="passage.js" defer></script>
</head>

<body>

    <main class="app passageMode">

        <!-- ====================================
             2. HEADER
        ==================================== -->

        <header class="appHeader">
        
<!-- Compact study mode navigation -->

<nav class="modeNavigation" aria-label="Study mode">

    <select
        aria-label="Choose study mode"
        onchange="window.location.href = this.value"
    >
        <option value="index.html">
            Vocabulary
        </option>

<option value="passage.html" selected>
    Passages
</option>
    </select>

</nav>

            <p class="eyebrow">Ancient Greek Study</p>

            <h1>Mnemosyne</h1>

            <p class="subtitle">
                Read and translate Athenaze,
                one sentence at a time.
            </p>
        </header>

        <!-- ====================================
             3. STUDY SETTINGS
        ==================================== -->

        <section
            class="settingsPanel"
            aria-label="Passage settings"
        >

            <h2 class="panelTitle">Study Settings</h2>

            <div class="studyFilters">

                <div class="filterGroup">

                    <label for="chapterSelect">
                        Chapter
                    </label>

                    <select
                        id="chapterSelect"
                        onchange="changeChapter()"
                    ></select>

                </div>

                <div class="filterGroup">

                    <label for="sectionSelect">
                        Section
                    </label>

                    <select
                        id="sectionSelect"
                        onchange="changeSection()"
                    ></select>

                </div>

            </div>

        </section>

        <!-- ====================================
             4. PASSAGE FLASHCARD
        ==================================== -->

        <section
            class="flashcardArea"
            aria-label="Sentence study"
        >

            <div class="flashcardHeader">

                <span id="sentenceCounter">
                    Sentence 0 of 0
                </span>

                <span id="languageLabel">
                    GREEK
                </span>

            </div>

            <div id="flashcardBox">

                <!-- Previous sentence: left edge -->

                <button
                    type="button"
                    class="cardEdge leftEdge"
                    id="previousSentenceButton"
                    onclick="previousSentence()"
                    aria-label="Previous sentence"
                >
                    &#10094;
                </button>

                <!-- Clickable sentence text -->

                <div class="flashcardTextArea">

                    <span
                        id="flashcardText"
                        role="button"
                        tabindex="0"
                        aria-label="Translate current sentence"
                        onclick="translateSentence()"
                        onkeydown="handleSentenceKeydown(event)"
                    >
                        Loading passage...
                    </span>

                </div>

                <!-- Next sentence: right edge -->

                <button
                    type="button"
                    class="cardEdge rightEdge"
                    id="nextSentenceButton"
                    onclick="nextSentence()"
                    aria-label="Next sentence"
                >
                    &#10095;
                </button>

            </div>

        </section>

        <!-- ====================================
             5. TRANSLATE BUTTON
        ==================================== -->

        <section
            class="studyButtons"
            aria-label="Translation controls"
        >

            <button
                type="button"
                class="actionButton"
                id="translateButton"
                onclick="translateSentence()"
            >
                Translate
            </button>

        </section>

        <!-- ====================================
             6. FULL PASSAGE
        ==================================== -->

        <section
            class="passageSection"
            aria-label="Full Greek passage"
        >

            <h2>Full Passage</h2>

            <div id="fullPassage"></div>

        </section>

        <!-- ====================================
             7. FOOTER
        ==================================== -->

        <footer class="appFooter">
            MNEMOSYNE · ATHENAZE PASSAGES
        </footer>

    </main>

</body>
</html>
